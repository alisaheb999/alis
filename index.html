
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zoravex - Premium Digital Product Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FFC000;
      --secondary: #222222;
      --bg: #fdfdfd;
    }
    
    body {
      font-family: 'Inter', 'Hind Siliguri', sans-serif;
      background-color: var(--bg);
      color: var(--secondary);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Support for Bengali Font Specificity */
    [lang="bn"] {
      font-family: 'Hind Siliguri', sans-serif;
    }

    .primary-yellow {
      background-color: var(--primary);
    }

    .text-primary-yellow {
      color: var(--primary);
    }

    .border-primary-yellow {
      border-color: var(--primary);
    }

    .product-card-shadow {
      box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
    }

    .product-card-shadow:hover {
      box-shadow: 0 20px 25px -5px rgba(255, 192, 0, 0.1), 0 10px 10px -5px rgba(255, 192, 0, 0.04);
      transform: translateY(-4px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    /* Layout fixes for mobile overflowing content */
    input, textarea {
      font-size: 16px !important; /* Prevents auto-zoom on iOS */
    }

    .glass-effect {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
