<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f9ff;
    --blue: #2563ff;
    --deep: #1d4ed8;
    --sky: #4fa3ff;
    --ink: #0b1a4a;
    --muted: #6b7cb3;
    --warn: #f43f5e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
  .glow { position: absolute; border-radius: 50%; filter: blur(140px); }
  #g1 { width: 900px; height: 900px; background: #bcd3ff; }
  #g2 { width: 800px; height: 800px; background: #cfe4ff; }
  #g3 { width: 760px; height: 760px; background: radial-gradient(circle, #8fb4ff, #b9d2ff 60%, transparent 70%); opacity: 0; }
  .mote { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #5b8cff; }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }

  .scene { position: absolute; inset: 0; display: none; transform-origin: 50% 45%; }
  .bn { font-family: 'Hind Siliguri', sans-serif; font-weight: 700; }
  .mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; letter-spacing: 8px; color: var(--muted); }
  .center { position: absolute; width: 100%; text-align: center; white-space: nowrap; }
  .glass { position: absolute; border-radius: 40px; background: rgba(255,255,255,.78);
           border: 1.5px solid rgba(37,99,255,.14);
           box-shadow: 0 40px 80px -30px rgba(37,99,255,.35), inset 0 1px 0 #fff; }
  .grad { background: linear-gradient(90deg, #1d4ed8, #2563ff 50%, #4fa3ff);
          -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* intro */
  #title { top: 930px; font: 700 92px 'Space Grotesk', sans-serif; color: var(--ink); }
  #tag { top: 1060px; font-size: 24px; letter-spacing: 10px; }

  /* progress */
  #prog { position: absolute; top: 48px; left: 90px; width: 900px; height: 6px; border-radius: 6px; background: rgba(37,99,255,.12); overflow: hidden; }
  #progFill { height: 100%; background: linear-gradient(90deg, var(--deep), var(--sky)); border-radius: 6px; }

  /* s3 */
  #s3num { top: 470px; font-size: 230px; line-height: 1; color: var(--ink); }
  #s3unit { top: 720px; font-size: 64px; color: var(--blue); }
  #s3tag { top: 215px; font-size: 26px; }

  /* s4 */
  #flow { left: 50%; top: 300px; height: 96px; padding: 0 40px 0 24px; border-radius: 60px; display: flex; align-items: center; gap: 18px;
          transform: translateX(-50%); font: 700 40px 'Space Grotesk', sans-serif; color: var(--ink); }
  #credits { top: 520px; font: 700 230px 'Space Grotesk', sans-serif; line-height: 1; color: var(--ink); }
  #creditsLbl { top: 800px; font-size: 28px; }

  /* s4b */
  .card { width: 420px; height: 540px; left: 330px; top: 360px; transform-origin: 50% 110%; }
  #s4bLbl { top: 1010px; font-size: 26px; }

  /* s5 */
  .tile { width: 390px; height: 340px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
  .tile .name { font: 700 40px 'Space Grotesk', sans-serif; color: var(--ink); }
  .tile .ico { width: 120px; height: 120px; border-radius: 34px; display: grid; place-items: center;
               background: linear-gradient(145deg, #e8f0ff, #d6e4ff); }

  /* s6 */
  #cal { width: 460px; height: 540px; left: 310px; top: 330px; overflow: hidden; perspective: 900px; }
  #calHead { height: 120px; background: linear-gradient(90deg, var(--deep), var(--sky)); color: #fff;
             font-size: 52px; display: grid; place-items: center; }
  .day { position: absolute; top: 150px; left: 0; width: 100%; text-align: center; font: 700 270px 'Space Grotesk', sans-serif;
         color: var(--ink); line-height: 1.2; height: 390px; background: #fff; backface-visibility: hidden; transform-origin: 50% 0; }
  #s6tag { top: 930px; font-size: 26px; }

  /* s7 */
  #toggle { left: 340px; top: 360px; width: 400px; height: 190px; border-radius: 100px; }
  #knob { position: absolute; top: 20px; width: 150px; height: 150px; border-radius: 50%; background: #fff;
          box-shadow: 0 10px 30px rgba(11,26,74,.25); }
  #offLbl { top: 300px; font-size: 26px; }
  #price { left: 250px; top: 650px; width: 580px; height: 230px; display: flex; align-items: center; justify-content: center; gap: 30px; }
  #price .amt { font: 700 96px 'Space Grotesk', sans-serif; color: var(--ink); }
  #price .per { font-size: 44px; color: var(--muted); }

  /* s8 */
  #missBtn { position: absolute; left: 50%; top: 930px; height: 130px; padding: 0 70px; border-radius: 80px; transform: translateX(-50%);
             background: linear-gradient(90deg, var(--deep), var(--sky)); color: #fff; font-size: 56px;
             display: flex; align-items: center; white-space: nowrap; box-shadow: 0 30px 60px -20px rgba(37,99,255,.7); }
  #s8title { top: 900px; font: 700 80px 'Space Grotesk', sans-serif; color: var(--ink); }

  /* s9 */
  .opt { width: 400px; height: 440px; top: 560px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }
  .opt .t { font-size: 46px; color: var(--ink); }

  /* s10 */
  #check { left: 200px; top: 760px; width: 680px; height: 300px; padding: 40px 54px; display: flex; flex-direction: column; justify-content: space-around; }
  .row { display: flex; align-items: center; gap: 30px; font-size: 48px; color: var(--ink); }
  .box { width: 70px; height: 70px; border-radius: 22px; border: 4px solid rgba(37,99,255,.3); position: relative; flex: none; }
  .box .fill { position: absolute; inset: -4px; border-radius: 22px; background: var(--blue); display: grid; place-items: center; }

  /* s11 */
  #endTitle { top: 860px; font: 700 96px 'Space Grotesk', sans-serif; color: var(--ink); }
  #endTag { top: 990px; font-size: 26px; }

  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(37,99,255,.10) 100%); }
  #grain { position: absolute; inset: -50px; width: 1180px; height: 1450px; opacity: .025; }
  #fade { position: absolute; inset: 0; background: #fff; }
</style>
</head>
<body>
<div id="stage">
  <div id="g1" class="glow"></div><div id="g2" class="glow"></div><div id="g3" class="glow"></div>
  <div id="dust"></div>

  <!-- shared defs -->
  <svg width="0" height="0">
    <defs>
      <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#2563ff"/><stop offset="1" stop-color="#4fa3ff"/>
      </linearGradient>
      <radialGradient id="rayFade"><stop offset="0" stop-color="#2563ff" stop-opacity=".16"/><stop offset="1" stop-color="#2563ff" stop-opacity="0"/></radialGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
      <symbol id="spark" viewBox="-1 -1 2 2"><path d="M0,-1 Q0,0 1,0 Q0,0 0,1 Q0,0 -1,0 Q0,0 0,-1 Z" fill="url(#gem)"/></symbol>
    </defs>
  </svg>

  <!-- 1–2: intro (0 – 6.6) -->
  <div id="s12" class="scene">
    <svg width="1080" height="1350">
      <g id="rays" transform="translate(540 600)"></g>
      <circle id="ring1" cx="540" cy="600" fill="none" stroke="#2563ff" stroke-width="3"/>
      <circle id="ring2" cx="540" cy="600" fill="none" stroke="#4fa3ff" stroke-width="3"/>
      <g id="badge" transform="translate(540 600)">
        <rect id="badgeRect" x="-130" y="-130" width="260" height="260" rx="56" fill="none" stroke="#2563ff" stroke-width="6" pathLength="1"/>
      </g>
      <rect id="stem" x="-17" width="34" rx="17" fill="#2563ff"/>
      <circle id="dot" r="20" fill="#2563ff"/>
      <g id="star" transform="translate(540 600)">
        <path d="M0,-1 Q0,0 1,0 Q0,0 0,1 Q0,0 -1,0 Q0,0 0,-1 Z" transform="scale(190)" fill="url(#gem)" filter="url(#soft)" opacity=".8"/>
        <path d="M0,-1 Q0,0 1,0 Q0,0 0,1 Q0,0 -1,0 Q0,0 0,-1 Z" transform="scale(170)" fill="url(#gem)"/>
      </g>
      <g id="orbit" transform="translate(540 600)"></g>
    </svg>
    <div id="title" class="center">Gemini <b class="grad">AI Pro</b></div>
    <div id="tag" class="center mono">GOOGLE</div>
  </div>

  <!-- 3: 18-month offer running out (6.64 – 10.3) -->
  <div id="s3" class="scene">
    <svg width="1080" height="1350">
      <circle cx="540" cy="600" r="300" fill="none" stroke="rgba(37,99,255,.12)" stroke-width="22"/>
      <circle id="arc" cx="540" cy="600" r="300" fill="none" stroke="#2563ff" stroke-width="22" stroke-linecap="round"
              pathLength="1" transform="rotate(-90 540 600)"/>
      <circle id="arcHead" r="20" fill="#fff" stroke="#2563ff" stroke-width="8"/>
    </svg>
    <div id="s3tag" class="center mono">JIO OFFER</div>
    <div id="s3num" class="center bn">১৮</div>
    <div id="s3unit" class="center bn">মাস</div>
  </div>

  <!-- 4a: Google Flow, 1000 credits (10.47 – 14.8) -->
  <div id="s4" class="scene">
    <div id="flow" class="glass">
      <svg width="56" height="56" viewBox="0 0 24 24" style="position:static"><path d="M3 15c3-6 6 2 9-3s6-3 9-8" fill="none" stroke="#2563ff" stroke-width="2.6" stroke-linecap="round"/><path d="M3 20c3-6 6 2 9-3s6-3 9-8" fill="none" stroke="#4fa3ff" stroke-width="2.6" stroke-linecap="round" opacity=".6"/></svg>
      Google Flow
    </div>
    <svg width="1080" height="1350"><g id="tokens"></g></svg>
    <div id="credits" class="center bn"></div>
    <div id="creditsLbl" class="center mono">AI CREDITS / MONTH</div>
  </div>

  <!-- 4b: premium models (14.91 – 16.95) -->
  <div id="s4b" class="scene">
    <div class="glass card" id="c1"></div>
    <div class="glass card" id="c2"></div>
    <div class="glass card" id="c3">
      <svg width="420" height="540"><use href="#spark" x="130" y="190" width="160" height="160"/></svg>
    </div>
    <div id="s4bLbl" class="center mono">PREMIUM AI MODELS</div>
  </div>

  <!-- 5: feature tiles (17.11 – 23.6) -->
  <div id="s5" class="scene">
    <div class="glass tile" id="t1" style="left:135px;top:300px">
      <div class="ico"><svg width="64" height="64" viewBox="0 0 24 24" style="position:static"><rect x="2.5" y="5" width="19" height="14" rx="3" fill="none" stroke="#2563ff" stroke-width="2"/><path d="M10 9.2v5.6l4.6-2.8z" fill="#2563ff"/></svg></div>
      <div class="name">Veo</div>
    </div>
    <div class="glass tile" id="t2" style="left:555px;top:300px">
      <div class="ico"><svg width="64" height="64" viewBox="0 0 24 24" style="position:static"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="#2563ff" stroke-width="2"/><path d="M5 17l4.5-5 3.5 3.5 2.5-2.5L19 17" fill="none" stroke="#2563ff" stroke-width="2" stroke-linejoin="round"/><circle cx="15.5" cy="8.5" r="1.8" fill="#4fa3ff"/></svg></div>
      <div class="name">Nano Banana</div>
    </div>
    <div class="glass tile" id="t3" style="left:135px;top:680px">
      <div class="ico"><svg width="64" height="64" viewBox="0 0 24 24" style="position:static"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#2563ff" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="#2563ff" stroke-width="2.4" stroke-linecap="round"/><path d="M7.5 9h6M7.5 12h4" stroke="#4fa3ff" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div class="name">Deep Research</div>
    </div>
    <div class="glass tile" id="t4" style="left:555px;top:680px">
      <div class="ico"><svg width="64" height="64" viewBox="0 0 24 24" style="position:static"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.5 10a4.25 4.25 0 0 0 .5 8.5z" fill="none" stroke="#2563ff" stroke-width="2" stroke-linejoin="round"/></svg></div>
      <div class="name">5 TB</div>
    </div>
  </div>

  <!-- 6: calendar, 29 October (23.89 – 28.2) -->
  <div id="s6" class="scene">
    <div id="cal" class="glass">
      <div id="calHead" class="bn">অক্টোবর</div>
      <div id="days"></div>
    </div>
    <svg width="1080" height="1350">
      <rect id="calRing" x="290" y="310" width="500" height="580" rx="56" fill="none" stroke="#f43f5e" stroke-width="6" pathLength="1"/>
    </svg>
    <div id="s6tag" class="center mono">LAST DAY</div>
  </div>

  <!-- 7: offer off, regular price (28.39 – 32.8) -->
  <div id="s7" class="scene">
    <div id="offLbl" class="center mono">OFFER</div>
    <div id="toggle" class="glass"><div id="knob"></div></div>
    <div id="price" class="glass">
      <svg id="cycle" width="96" height="96" viewBox="0 0 24 24" style="position:static"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="#2563ff" stroke-width="2.2" stroke-linecap="round"/><path d="M20 4v4.5h-4.5" fill="none" stroke="#2563ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="amt">৳ ••••</span><span class="per bn">/মাস</span>
    </div>
  </div>

  <!-- 8: don't miss it (32.96 – 38.6) -->
  <div id="s8" class="scene">
    <svg width="1080" height="1350">
      <g id="rays8" transform="translate(540 560)"></g>
      <circle id="iris" cx="540" cy="560" fill="none" stroke="#2563ff" stroke-width="5"/>
      <circle id="iris2" cx="540" cy="560" fill="none" stroke="#4fa3ff" stroke-width="2" stroke-dasharray="6 14"/>
      <g id="star8"><use href="#spark" x="-1" y="-1" width="2" height="2"/></g>
    </svg>
    <div id="s8title" class="center">Gemini <b class="grad">AI Pro</b></div>
    <div id="missBtn" class="bn">মিস করবেন না</div>
  </div>

  <!-- 9: from us or a trusted seller (38.81 – 44.2) -->
  <div id="s9" class="scene">
    <svg width="1080" height="1350">
      <path id="l1" d="M540 330 C540 450 340 430 340 560" fill="none" stroke="#2563ff" stroke-width="4" stroke-dasharray="1" pathLength="1"/>
      <path id="l2" d="M540 330 C540 450 740 430 740 560" fill="none" stroke="#4fa3ff" stroke-width="4" pathLength="1"/>
      <g transform="translate(540 270)"><use href="#spark" x="-70" y="-70" width="140" height="140"/></g>
    </svg>
    <div class="glass opt" id="o1" style="left:130px">
      <div class="ico"><svg width="110" height="110" viewBox="0 0 24 24" style="position:static"><path d="M4 9.5L5.5 4h13L20 9.5" fill="none" stroke="#2563ff" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0" fill="none" stroke="#2563ff" stroke-width="1.8"/><path d="M5.5 12.5V20h13v-7.5M10 20v-4.5h4V20" fill="none" stroke="#2563ff" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
      <div class="t bn">আমাদের থেকে</div>
    </div>
    <div class="glass opt" id="o2" style="left:550px">
      <div class="ico"><svg width="110" height="110" viewBox="0 0 24 24" style="position:static"><circle cx="10" cy="8" r="3.6" fill="none" stroke="#4fa3ff" stroke-width="1.8"/><path d="M3.5 20a6.5 6.5 0 0 1 11.2-4.5" fill="none" stroke="#4fa3ff" stroke-width="1.8" stroke-linecap="round"/><path d="M15 18.2l2 2 4-4.2" fill="none" stroke="#2563ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="t bn">বিশ্বস্ত সেলার</div>
    </div>
  </div>

  <!-- 10: verify first (44.35 – 49.3) -->
  <div id="s10" class="scene">
    <svg width="1080" height="1350">
      <g transform="translate(540 470)">
        <path id="shieldFill" d="M0 -230 L190 -160 V10 C190 140 90 220 0 260 C-90 220 -190 140 -190 10 V-160 Z" fill="url(#gem)"/>
        <path id="shield" d="M0 -230 L190 -160 V10 C190 140 90 220 0 260 C-90 220 -190 140 -190 10 V-160 Z" fill="none" stroke="#2563ff" stroke-width="10" stroke-linejoin="round" pathLength="1"/>
        <path id="shieldTick" d="M-75 10 L-20 65 L85 -50" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
      </g>
    </svg>
    <div id="check" class="glass">
      <div class="row bn"><div class="box"><div class="fill" id="b1"><svg width="40" height="40" viewBox="0 0 24 24" style="position:static"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>অ্যাক্টিভেশন</div>
      <div class="row bn"><div class="box"><div class="fill" id="b2"><svg width="40" height="40" viewBox="0 0 24 24" style="position:static"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>শর্তাবলি</div>
    </div>
  </div>

  <!-- 11: money in the right place, end card (49.36 – 55) -->
  <div id="s11" class="scene">
    <svg width="1080" height="1350">
      <g id="target" transform="translate(540 760)">
        <circle r="250" fill="none" stroke="rgba(37,99,255,.18)" stroke-width="4"/>
        <circle r="170" fill="none" stroke="rgba(37,99,255,.3)" stroke-width="4"/>
        <circle r="90" fill="rgba(37,99,255,.1)" stroke="#2563ff" stroke-width="5"/>
      </g>
      <circle id="hit" cx="540" cy="760" fill="none" stroke="#2563ff" stroke-width="4"/>
      <g id="coin">
        <circle r="78" fill="url(#gem)"/>
        <circle r="62" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="3"/>
        <text y="30" text-anchor="middle" font-family="Hind Siliguri" font-weight="700" font-size="88" fill="#fff">৳</text>
      </g>
      <g id="endStar"><use href="#spark" x="-1" y="-1" width="2" height="2"/></g>
    </svg>
    <div id="endTitle" class="center">Gemini <b class="grad">AI Pro</b></div>
    <div id="endTag" class="center mono">ACTIVATE · VERIFY · ENJOY</div>
  </div>

  <div id="prog"><div id="progFill"></div></div>
  <canvas id="grain" width="590" height="725"></canvas>
  <div id="vignette"></div>
  <div id="fade"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = x => 1 - Math.pow(1 - x, 3);
const inCubic = x => x * x * x;
const inOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const outBack = x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
const lerp = (a, b, x) => a + (b - a) * x;
const BN = '০১২৩৪৫৬৭৮৯';
const bn = n => String(n).replace(/\d/g, d => BN[d]);
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const NS = 'http://www.w3.org/2000/svg';
const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const DUR = 55;

const r = rng(7), motes = [];
for (let i = 0; i < 46; i++) {
  const m = document.createElement('div'); m.className = 'mote'; $('dust').appendChild(m);
  motes.push({ el: m, x: r() * 1080, y: r() * 1350, s: .5 + r() * 1.6, v: 10 + r() * 30, o: .15 + r() * .45, p: r() * 6 });
}
for (const g of ['rays', 'rays8'])
  for (let i = 0; i < 12; i++) mk('rect', { x: -6, y: -620, width: 12, height: 620, fill: 'url(#rayFade)', transform: `rotate(${i * 30})` }, $(g));
const orbs = [0, 1, 2].map(i => mk('circle', { r: 11, fill: ['#1d4ed8', '#4fa3ff', '#93c5fd'][i] }, $('orbit')));
const tokens = [];
for (let i = 0; i < 18; i++) {
  const a = r() * Math.PI * 2, d = 380 + r() * 220;
  tokens.push({ el: mk('circle', { r: 8 + r() * 8, fill: i % 2 ? '#2563ff' : '#4fa3ff' }, $('tokens')), x: 540 + Math.cos(a) * d, y: 620 + Math.sin(a) * d, d: r() * .5 });
}
const DAYS = [24, 25, 26, 27, 28, 29];
DAYS.forEach(d => { const e = document.createElement('div'); e.className = 'day'; e.textContent = bn(d); $('days').appendChild(e); });
const dayEls = [...$('days').children];

const grain = $('grain').getContext('2d');
const gimg = grain.createImageData(590, 725);

// Shows a scene between a and b with a soft rise-in and blur-out. Returns visibility 0–1.
function scene(id, t, a, b, inDur = .45, outDur = .4) {
  const el = $(id);
  const i = outCubic(prog(t, a, a + inDur)), o = inCubic(prog(t, b, b + outDur));
  const v = i * (1 - o);
  if (v <= .001) { el.style.display = 'none'; return 0; }
  el.style.display = 'block';
  el.style.opacity = v;
  el.style.transform = `translateY(${(1 - i) * 50}px) scale(${(1 + (t - a) * .006) * (1 - o * .06)})`;
