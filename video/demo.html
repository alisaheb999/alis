<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #f7f9ff;
    --yellow: #2563ff;
    --ink: #0b1a4a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #f7f9ff; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--navy); }
  .glow { position: absolute; border-radius: 50%; filter: blur(140px); }
  #g1 { width: 900px; height: 900px; background: #bcd3ff; }
  #g2 { width: 800px; height: 800px; background: #cfe4ff; }
  #g3 { width: 760px; height: 760px; background: radial-gradient(circle, #8fb4ff, #b9d2ff 60%, transparent 70%); opacity: 0; }
  .mote { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #5b8cff; }
  #cam { position: absolute; inset: 0; transform-origin: 50% 45%; }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }

  #title { position: absolute; top: 930px; width: 100%; text-align: center; white-space: nowrap;
           font: 700 92px 'Space Grotesk', sans-serif; color: var(--ink); }
  #title b { background: linear-gradient(90deg, #1d4ed8, #2563ff 50%, #4fa3ff);
             -webkit-background-clip: text; background-clip: text; color: transparent; }
  #tag { position: absolute; top: 1060px; width: 100%; text-align: center;
         font: 500 24px 'JetBrains Mono', monospace; letter-spacing: 10px; color: #6b7cb3; }

  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(37,99,255,.10) 100%); }
  #grain { position: absolute; inset: -50px; width: 1180px; height: 1450px; opacity: .025; }
  #fade { position: absolute; inset: 0; background: #fff; }
</style>
</head>
<body>
<div id="stage">
  <div id="g1" class="glow"></div><div id="g2" class="glow"></div><div id="g3" class="glow"></div>
  <div id="dust"></div>
  <div id="cam">
    <svg width="1080" height="1350">
      <defs>
        <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#2563ff"/><stop offset="1" stop-color="#4fa3ff"/>
        </linearGradient>
        <radialGradient id="rayFade"><stop offset="0" stop-color="#2563ff" stop-opacity=".16"/><stop offset="1" stop-color="#2563ff" stop-opacity="0"/></radialGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
      </defs>
      <!-- light rays behind the star -->
      <g id="rays" transform="translate(540 600)"></g>
      <!-- burst rings -->
      <circle id="ring1" cx="540" cy="600" fill="none" stroke="#2563ff" stroke-width="3"/>
      <circle id="ring2" cx="540" cy="600" fill="none" stroke="#4fa3ff" stroke-width="3"/>
      <!-- tilted badge frame around the "!" -->
      <g id="badge" transform="translate(540 600)">
        <rect id="badgeRect" x="-130" y="-130" width="260" height="260" rx="56" fill="none" stroke="#2563ff" stroke-width="6" pathLength="1"/>
      </g>
      <!-- "!" : stem + dot -->
      <rect id="stem" x="-17" width="34" rx="17" fill="#2563ff"/>
      <circle id="dot" r="20" fill="#2563ff"/>
      <!-- the sparkle -->
      <g id="star" transform="translate(540 600)">
        <path d="M0,-1 Q0,0 1,0 Q0,0 0,1 Q0,0 -1,0 Q0,0 0,-1 Z" transform="scale(190)" fill="url(#gem)" filter="url(#soft)" opacity=".8"/>
        <path d="M0,-1 Q0,0 1,0 Q0,0 0,1 Q0,0 -1,0 Q0,0 0,-1 Z" transform="scale(170)" fill="url(#gem)"/>
      </g>
      <!-- orbiting "thinking" particles -->
      <g id="orbit" transform="translate(540 600)"></g>
    </svg>
    <div id="title">Gemini <b>AI Pro</b></div>
    <div id="tag">GOOGLE</div>
  </div>
  <canvas id="grain" width="590" height="725"></canvas>
  <div id="vignette"></div>
  <div id="fade"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = x => 1 - Math.pow(1 - x, 3);
const inCubic = x => x * x * x;
const inOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const outBack = x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
const lerp = (a, b, x) => a + (b - a) * x;
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const NS = 'http://www.w3.org/2000/svg';
const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

const r = rng(7), motes = [];
for (let i = 0; i < 46; i++) {
  const m = document.createElement('div'); m.className = 'mote'; $('dust').appendChild(m);
  motes.push({ el: m, x: r() * 1080, y: r() * 1350, s: .5 + r() * 1.6, v: 10 + r() * 30, o: .15 + r() * .45, p: r() * 6 });
}
for (let i = 0; i < 12; i++) mk('rect', { x: -6, y: -620, width: 12, height: 620, fill: 'url(#rayFade)', transform: `rotate(${i * 30})` }, $('rays'));
const orbs = [0, 1, 2].map(i => mk('circle', { r: 11, fill: ['#1d4ed8', '#4fa3ff', '#93c5fd'][i] }, $('orbit')));

const grain = $('grain').getContext('2d');
const gimg = grain.createImageData(590, 725);

// Voice timing (from the audio's pauses):
// 0.00–0.42 "ভাই,"  0.75–2.17 "একটা গুরুত্বপূর্ণ কথা বলি।"
// 2.62–4.17 "যারা Google Gemini AI Pro"  4.27–5.60 "নেওয়ার কথা ভাবছেন,"
window.render = function (t) {
  const gem = prog(t, 2.62, 3.1);
  $('g1').style.transform = `translate(${-200 + Math.sin(t * .7) * 60}px, ${-150 + Math.cos(t * .5) * 50}px)`;
  $('g2').style.transform = `translate(${480 + Math.cos(t * .6) * 70}px, ${700 + Math.sin(t * .8) * 60}px)`;
  $('g1').style.opacity = .9; $('g2').style.opacity = .8;
  $('g3').style.transform = `translate(160px, 220px) scale(${.8 + gem * .3 + Math.sin(t * 2) * .03})`;
  $('g3').style.opacity = gem * .55;
  motes.forEach(m => {
    const y = ((m.y - t * m.v) % 1350 + 1350) % 1350;
    m.el.style.transform = `translate(${m.x + Math.sin(t + m.p) * 14}px, ${y}px) scale(${m.s})`;
    m.el.style.opacity = m.o * prog(t, 0, .8);
  });

  // camera: slow push-in with a soft punch on the star reveal
  const punch = Math.sin(prog(t, 2.62, 3.0) * Math.PI) * .035;
  $('cam').style.transform = `scale(${1 + t * .012 + punch})`;

  // "ভাই," — yellow dot pops in with a ring
  const born = outBack(prog(t, .02, .4));
  const r1 = outCubic(prog(t, .05, .9));
  $('ring1').setAttribute('r', r1 * 240);
  $('ring1').setAttribute('opacity', t > .05 ? (1 - r1) : 0);

  // "একটা গুরুত্বপূর্ণ কথা বলি" — dot drops, "!" stem rises, tilted badge draws around it
  const rise = outBack(prog(t, .75, 1.15));
  const retract = inCubic(prog(t, 2.17, 2.55));
  const stemH = 130 * rise * (1 - retract);
  const dotY = 600 + lerp(0, 75, outCubic(prog(t, .7, 1.0))) * (1 - retract) - retract * 0;
  const floatY = Math.sin(t * 3) * 5 * prog(t, 1.1, 1.4) * (1 - retract);
  $('dot').setAttribute('cx', 540);
  $('dot').setAttribute('cy', dotY + floatY);
  $('dot').setAttribute('r', 20 * born * (1 - prog(t, 2.62, 2.75)));
  $('stem').setAttribute('y', dotY + floatY - 45 - stemH);
  $('stem').setAttribute('height', Math.max(0, stemH));
  $('stem').setAttribute('transform', '');
  $('stem').style.transform = 'translateX(540px)';
  const dot = $('dot');
  dot.style.filter = $('stem').style.filter = `drop-shadow(0 0 22px rgba(37,99,255,.45))`;

  const draw = inOutCubic(prog(t, .85, 1.6));
  const bOut = inOutCubic(prog(t, 2.1, 2.6));
  $('badgeRect').setAttribute('stroke-dasharray', `${draw} 1`);
  $('badge').setAttribute('transform', `translate(540 600) rotate(${lerp(-30, -8, outCubic(prog(t, .85, 1.8))) + bOut * 140}) scale(${1 - bOut})`);
  $('badge').setAttribute('opacity', 1 - bOut);
  $('badge').style.filter = 'drop-shadow(0 0 16px rgba(37,99,255,.35))';

  // "যারা Google Gemini AI Pro" — the dot blooms into a sparkle
  const s = outBack(prog(t, 2.62, 3.15));
  const breathe = 1 + Math.sin((t - 3.1) * 3.2) * .025 * prog(t, 3.1, 3.4);
  $('star').setAttribute('transform', `translate(540 600) rotate(${lerp(-135, 0, outCubic(prog(t, 2.62, 3.3)))}) scale(${s * breathe})`);
  const r2 = outCubic(prog(t, 2.62, 3.5));
  $('ring2').setAttribute('r', r2 * 420);
  $('ring2').setAttribute('opacity', t > 2.62 ? (1 - r2) * .9 : 0);
  $('rays').setAttribute('transform', `translate(540 600) rotate(${t * 12}) scale(${outCubic(gem)})`);
  $('rays').setAttribute('opacity', gem * .9);

  // title wipes in on "Gemini AI Pro"
  const ti = outCubic(prog(t, 3.05, 3.7));
  $('title').style.clipPath = `inset(0 ${(1 - ti) * 50}% 0 ${(1 - ti) * 50}%)`;
  $('title').style.letterSpacing = lerp(18, -1, ti) + 'px';
  $('title').style.opacity = ti;
  $('title').style.filter = `blur(${(1 - ti) * 10}px)`;
  const tg = prog(t, 3.5, 3.9);
  $('tag').style.opacity = tg;
  $('tag').style.transform = `translateY(${(1 - outCubic(tg)) * 20}px)`;

  // "নেওয়ার কথা ভাবছেন" — three orbs orbit the star, like a thought forming
  const ob = outCubic(prog(t, 4.2, 4.7));
  orbs.forEach((o, i) => {
    const a = t * 2.6 + i * 2.094;
    const x = Math.cos(a) * 250 * ob, y = Math.sin(a) * 70 * ob;
    o.setAttribute('cx', x); o.setAttribute('cy', y - 10);
    o.setAttribute('opacity', ob * (Math.sin(a) > 0 ? 1 : .45));
    o.style.filter = `drop-shadow(0 0 12px ${o.getAttribute('fill')})`;
  });
  $('orbit').setAttribute('transform', `translate(540 600) rotate(-14)`);

  const gr = rng(1 + Math.floor(t * 30));
  for (let i = 0; i < gimg.data.length; i += 4) {
    const v = gr() * 255; gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = v; gimg.data[i + 3] = 255;
  }
  grain.putImageData(gimg, 0, 0);
  $('fade').style.opacity = 1 - prog(t, 0, .2);
};
render(0);
</script>
</body>
</html>
