<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Ghostae Caption</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { 
    font: 13px "Hind Siliguri", "Noto Sans Bengali", sans-serif; 
    background: #05070e; 
    color: #e2e8f0; 
    margin: 0; 
    padding: 16px; 
    
  }
  
  .container {
    max-width: 680px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  
  .title {
    font-size: 15px; 
    font-weight: 700; 
    letter-spacing: -0.2px;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 4px 12px;
    border-radius: 20px;
    background: #0a1020;
    border: 1px solid #1b2844;
    transition: all 0.2s;
  }
  .status-dot-wrap:hover {
    border-color: #334e77;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 10px #10b981;
    animation: pulse 2s infinite;
  }
  .status-dot.offline {
    background: #ef4444;
    box-shadow: 0 0 10px #ef4444;
  }
  .status-dot.checking {
    background: #f59e0b;
    box-shadow: 0 0 10px #f59e0b;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.9); }
  }

  .card { 
    background: #0b1020; 
    border: 1px solid #172033; 
    border-radius: 12px; 
    padding: 14px; 
    margin-bottom: 12px; 
  }

  /* 4 Premium Templates — Spacious 2x2 Grid */

  /* --- Studio Text Animation preset gallery --- */
  .anim-groups { display:flex; gap:6px; margin-bottom:8px; }
  .anim-group { flex:1; padding:6px 8px; border-radius:8px; border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.04); color:inherit; font-size:12px; cursor:pointer; }
  .anim-group.active { background:rgba(120,170,255,.22); border-color:rgba(120,170,255,.6); }
  .anim-tabs { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; max-height:86px; overflow:auto; }
  .anim-tab { padding:4px 8px; border-radius:999px; font-size:11px; cursor:pointer;
    border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04); color:inherit; }
  .anim-tab.active { background:rgba(255,215,120,.2); border-color:rgba(255,215,120,.55); }
  .anim-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-height:280px; overflow:auto; }
  @media (max-width:420px){ .anim-grid { grid-template-columns:repeat(2,1fr); } }
  .anim-card { position:relative; border-radius:10px; overflow:hidden; cursor:pointer;
    border:1px solid rgba(255,255,255,.12); background:#0d0f14; }
  .anim-card.active { border-color:#7fb2ff; box-shadow:0 0 0 1px #7fb2ff inset; }
  .anim-thumb, .anim-video { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; }
  .anim-video { position:absolute; inset:0; opacity:0; transition:opacity .15s; }
  .anim-name { padding:4px 6px; font-size:10px; line-height:1.25; opacity:.85;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .presets-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .preset-card {
    height: 128px;
    background: radial-gradient(120% 130% at 50% 0%, #0d1428 0%, #060a14 70%);
    border: 1.5px solid #1b2844;
    border-radius: 12px;
    padding: 14px 10px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }
  .preset-card:hover {
    border-color: #3b82f6;
    background: radial-gradient(120% 130% at 50% 0%, #101b34 0%, #080e1d 70%);
    transform: translateY(-1px);
  }
  .preset-card.active {
    border-color: #3b82f6;
    background: radial-gradient(120% 130% at 50% 0%, rgba(59,130,246,0.28) 0%, rgba(59,130,246,0.12) 70%);
    box-shadow: 0 0 0 1.5px #3b82f6, 0 8px 20px rgba(59, 130, 246, 0.28);
  }

  .preset-label {
    font-size: 10.5px;
    font-weight: 600;
    color: #64748b;
    letter-spacing: 0.3px;
  }
  .preset-card.active .preset-label {
    color: #93c5fd;
  }

  /* Caption option selects */
  .options-row {
    display: flex;
    gap: 8px;
    margin: 12px 0 10px;
    flex-wrap: wrap;
  }
  .opt {
    flex: 1 1 96px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 10px;
    color: #64748b;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .opt select {
    background: #060a14;
    border: 1.5px solid #1b2844;
    border-radius: 8px;
    color: #cbd5e1;
    font-size: 11.5px;
    padding: 6px 7px;
    outline: none;
    font-family: inherit;
  }
  .opt select:focus { border-color: #3b82f6; }

  .preset-words-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: nowrap;
    width: 100%;
    height: 46px;
    overflow: hidden;
    white-space: nowrap;
  }

  /* Outer wrapper carries motion only. No CSS filter and no background-clip:text
     anywhere: CEP's old Chromium paints the background BOX (a black rectangle)
     instead of the glyphs whenever those two are combined. */
  .preset-anim {
    display: inline-block;
    line-height: 1.25;
    will-change: transform, opacity;
  }

  .preset-word {
    font-size: 18px;
    font-weight: 700;
    font-family: "Hind Siliguri", "Noto Sans Bengali", "Nirmala UI", sans-serif;
    display: inline-block;
    line-height: 1.25;
    padding: 0 1px;
    background: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
  }

  /* Flat template colours — always readable, never a black box. */
  .grad-royal-gold { color: #FFC24A; }
  .grad-cyan-rise { color: #6BD9FF; }
  .grad-sunset-glow { color: #FF8A72; }
  .grad-platinum-elite { color: #E7EDF7; }


  /* Preview animations — mirror the actual per-word motion baked into the AE
     layers. Transforms are clamped so nothing escapes the card. */
  @keyframes previewRoyalPop {
    0%, 100% { transform: scale(0.55); opacity: 0; }
    35% { transform: scale(1.12); opacity: 1; }
    55% { transform: scale(0.96); opacity: 1; }
    70%, 92% { transform: scale(1.0); opacity: 1; }
  }
  .anim-royal-pop { animation: previewRoyalPop 2.4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }

  @keyframes previewCyanRise {
    0%, 100% { transform: translateY(10px) scale(0.88); opacity: 0; }
    40% { transform: translateY(0) scale(1.0); opacity: 1; }
    70%, 92% { transform: translateY(0) scale(1.0); opacity: 1; }
  }
  .anim-cyan-rise { animation: previewCyanRise 2.6s cubic-bezier(0.22, 0.9, 0.36, 1) infinite; }

  @keyframes previewSunsetTilt {
    0%, 100% { transform: rotate(-7deg) scale(0.9); opacity: 0; }
    45% { transform: rotate(0deg) scale(1.0); opacity: 1; }
    75%, 92% { transform: rotate(0deg) scale(1.0); opacity: 1; }
  }
  .anim-sunset-tilt { animation: previewSunsetTilt 2.8s ease-in-out infinite; }

  @keyframes previewPlatinumElegant {
    0%, 100% { transform: scale(0.95); opacity: 0; }
    50% { transform: scale(1.0); opacity: 1; }
    80%, 92% { transform: scale(1.0); opacity: 1; }
  }
  .anim-platinum-elegant { animation: previewPlatinumElegant 3s ease-in-out infinite; }

  .delay-1 { animation-delay: 0.0s; }
  .delay-2 { animation-delay: 0.28s; }
  .delay-3 { animation-delay: 0.56s; }

  /* Narrow panel: single-column template grid */
  @media (max-width: 380px) {
    .presets-grid { grid-template-columns: 1fr; }
    .preset-card { height: 104px; }
  }

  /* Modern Dropzone */
  .dropzone {
    border: 1.5px dashed #1b2844;
    border-radius: 10px;
    padding: 22px 14px;
    text-align: center;
    background: #060a14;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .dropzone:hover {
    border-color: #3b82f6;
    background: #080e1d;
  }
  .dropzone.dragover {
    border-color: #3b82f6;
    background: rgba(59, 130, 246, 0.1);
  }
  .dropzone-icon {
    width: 28px;
    height: 28px;
    margin: 0 auto 6px;
    color: #64748b;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dropzone:hover .dropzone-icon {
    color: #3b82f6;
  }
  .dropzone-placeholder {
    font-size: 12px;
    color: #94a3b8;
    font-weight: 500;
  }
  .dropzone-file {
    font-size: 13px;
    color: #93c5fd;
    font-weight: 600;
    display: none;
    word-break: break-all;
  }

  /* Actions & Progress */
  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .btn-primary {
    flex: 1;
    padding: 10px 16px;
    border: 0;
    border-radius: 8px;
    background: #2563eb;
    color: #ffffff;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.15s;
  }
  .btn-primary:hover:not(:disabled) {
    background: #1d4ed8;
  }
  .btn-primary:disabled {
    background: #121a2c;
    color: #64748b;
    cursor: not-allowed;
  }

  .btn-icon {
    width: 38px;
    height: 38px;
    padding: 0;
    border: 1px solid #1b2844;
    border-radius: 8px;
    background: #0a1020;
    color: #94a3b8;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .btn-icon:hover:not(:disabled) {
    border-color: #475569;
    color: #ffffff;
    background: #121a2c;
  }
  .btn-icon:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn-apply {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: #059669;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.15s;
  }
  .btn-apply:hover:not(:disabled) {
    background: #047857;
  }
  .btn-apply:disabled {
    background: #121a2c;
    color: #64748b;
    cursor: not-allowed;
  }

  .bar { 
    height: 4px; 
    background: #121a2c; 
    border-radius: 2px; 
    overflow: hidden; 
    margin-top: 10px; 
  }
  .bar > i { 
    display: block; 
    height: 100%; 
    width: 0; 
    background: #10b981; 
    transition: width 0.3s; 
  }

  .status-text {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 6px;
    min-height: 15px;
  }
  .status-text.ok { color: #34d399; font-weight: 500; }
  .status-text.bad { color: #f87171; }

  pre { 
    max-height: 80px; 
    overflow: auto; 
    background: #060a14; 
    border: 1px solid #172033; 
    border-radius: 8px; 
    padding: 8px; 
    font-size: 10.5px; 
    font-family: monospace; 
    color: #94a3b8; 
    margin: 8px 0; 
  }

  /* ===== Ghostae Caption v1.2.3 — clean ink/violet theme ===== */
  body { background:#08080d; color:#e8e6f2; padding:14px; }
  .container { max-width:560px; }
  .card { background:#0e0e16; border:1px solid #1d1b2b; border-radius:14px; padding:12px; margin-bottom:10px; }
  .title { font-size:14px; gap:9px; }
  .brand-logo { width:22px; height:22px; border-radius:6px; object-fit:cover; display:block; }
  .header { margin-bottom:10px; }
  .header-right { display:flex; align-items:center; gap:8px; position:relative; }
  .status-dot-wrap { background:#12111c; border-color:#242235; padding:5px 9px; }
  .status-dot-wrap:hover { border-color:#4c3f7a; }
  .status-dot { background:#34d399; box-shadow:0 0 8px #34d399; }

  .plan-chip { display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:20px;
    background:#15122a; border:1px solid #2f2650; color:#c4b5fd; font-size:10.5px; font-weight:700;
    letter-spacing:.4px; cursor:pointer; transition:all .15s; }
  .plan-chip:hover { border-color:#7c5cff; color:#e9e2ff; }
  .plan-sheet { display:none; position:absolute; top:32px; right:0; z-index:20; width:212px;
    background:#12111c; border:1px solid #2b2740; border-radius:12px; padding:12px;
    box-shadow:0 18px 40px rgba(0,0,0,.55); }
  .plan-name { font-size:12.5px; font-weight:700; color:#ffffff; margin-bottom:8px; }
  .plan-row { display:flex; justify-content:space-between; gap:8px; font-size:11px; color:#9c98b5; padding:3px 0; }
  .plan-row b { color:#c4b5fd; font-weight:600; }
  .plan-hint { margin-top:8px; font-size:10px; color:#6f6b86; line-height:1.4; }

  .anim-groups { display:flex; gap:6px; margin-bottom:10px; }
  .anim-group { flex:1; padding:7px 4px; border-radius:9px; border:1px solid #242235;
    background:#12111c; color:#9c98b5; font-family:inherit; font-size:11.5px; font-weight:600; cursor:pointer; transition:all .15s; }
  .anim-group:hover { color:#e8e6f2; border-color:#3b3457; }
  .anim-group.active { background:#241d47; border-color:#7c5cff; color:#e9e2ff; }
  .anim-tabs { display:none !important; }
  .anim-name, .preset-label { display:none !important; }

  .anim-grid, .presets-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
    max-height:none; overflow:visible; }
  .anim-card { border:1px solid #242235; background:#0a0a11; border-radius:11px; }
  .anim-card:hover { border-color:#4c3f7a; }
  .anim-card.active { border-color:#7c5cff; box-shadow:0 0 0 1px #7c5cff inset; }
  .anim-thumb, .anim-video { aspect-ratio:16/9; }
  .anim-badge { position:absolute; top:6px; right:6px; width:18px; height:18px; border-radius:50%;
    background:#7c5cff; color:#fff; font-size:11px; line-height:18px; text-align:center;
    display:none; box-shadow:0 2px 8px rgba(124,92,255,.55); }
  .anim-card.active .anim-badge { display:block; }

  .preset-card { height:104px; border-color:#242235;
    background:radial-gradient(120% 130% at 50% 0%, #16142a 0%, #0a0a11 72%); border-radius:11px; }
  .preset-card:hover { border-color:#4c3f7a; background:radial-gradient(120% 130% at 50% 0%, #1c1836 0%, #0c0c14 72%); }
  .preset-card.active { border-color:#7c5cff;
    background:radial-gradient(120% 130% at 50% 0%, rgba(124,92,255,.26) 0%, rgba(124,92,255,.08) 72%);
    box-shadow:0 0 0 1.5px #7c5cff, 0 8px 20px rgba(124,92,255,.22); }

  .btn-primary { background:#7c5cff; border-radius:9px; }
  .btn-primary:hover:not(:disabled) { background:#6a48f5; }
  .btn-primary:disabled { background:#191826; color:#6f6b86; }
  .btn-icon { background:#12111c; border-color:#242235; color:#9c98b5; border-radius:9px; }
  .btn-icon:hover:not(:disabled) { border-color:#4c3f7a; background:#191826; color:#fff; }
  .btn-apply { background:#10b981; border-radius:11px; }
  .btn-apply:hover:not(:disabled) { background:#0e9e6e; }
  .btn-apply:disabled { background:#191826; color:#6f6b86; }
  .bar { background:#191826; }
  .bar > i { background:#7c5cff; }
  .status-text { color:#8d89a6; }
  .opt select { background:#0a0a11; border-color:#242235; color:#d9d6e8; }
  .opt select:focus { border-color:#7c5cff; }
  pre { background:#0a0a11; border-color:#1d1b2b; }
</style>
</head>
<body>
<div class="container">
  
  <!-- Header -->
  <div class="header">
    <div class="title">
      <img class="brand-logo" src="assets/logo.webp" alt="">
      <span>Ghostae Caption</span>
    </div>
    <div class="header-right">
      <div class="plan-chip" onclick="ghostTogglePlan()" title="বর্তমান প্ল্যান">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
        </svg>
        <span id="planTag">FREE</span>
      </div>
      <div id="statusWrap" class="status-dot-wrap" onclick="checkServerHealth()" title="সার্ভার স্ট্যাটাস">
        <div id="statusDot" class="status-dot"></div>
        <input id="serverUrl" type="hidden">
        <button id="saveServer" style="display:none"></button>
      </div>
      <div id="planSheet" class="plan-sheet"><div id="planBody"></div></div>
    </div>
  </div>

  <!-- 1. TOP: Caption Upload Option (Placeholder Area) -->
  <div class="card">
    <div id="dropzone" class="dropzone" onclick="triggerFileInput()">
      <div class="dropzone-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
          <path d="M12 12v9"/>
          <path d="m16 16-4-4-4 4"/>
        </svg>
      </div>
      <div id="dropPlaceholder" class="dropzone-placeholder">MP3, WAV, MP4, MOV</div>
      <div id="dropFileName" class="dropzone-file"></div>
      <input id="file" type="file" accept=".mp3,.wav,.m4a,.aac,.mp4,.mov,.webm,audio/*,video/*" style="display:none" onchange="handleFileSelected(this)">
    </div>

    <!-- Actions (Generate Button + Delete/Reset Action) -->
    <div class="action-row">
      <button id="generate" class="btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
        </svg>
        <span>ক্যাপশন তৈরি করুন</span>
      </button>

      <!-- Clear / Reset / Delete Icon Button -->
      <button id="cancelAll" class="btn-icon" title="রিসেট ও ডিলিট">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
        </svg>
      </button>
    </div>

    <!-- Use the audio of the layer currently selected in the AE timeline -->
    <div class="action-row" style="margin-top:8px;">
      <button id="pickLayer" class="btn-icon" style="width:100%;justify-content:center;gap:8px;display:flex;align-items:center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <span>সিলেক্ট করা লেয়ার ব্যবহার করুন</span>
      </button>
    </div>
    <div id="layerInfo" class="status-text" style="display:none;margin-top:6px;"></div>


    <!-- Progress & Status -->
    <div class="bar"><i id="fill"></i></div>
    <div class="status-row" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <div id="status" class="status-text" style="flex:1;min-width:0;"></div>
      <div id="elapsed" class="status-text" style="display:none;font-variant-numeric:tabular-nums;opacity:.85;white-space:nowrap;">00:00</div>
    </div>

  </div>

  <!-- Animation gallery: premium templates + bundled .ffx presets -->
  <div class="card">
    <div id="animGroups" class="anim-groups">
      <button type="button" class="anim-group active" data-group="premium">প্রিমিয়াম</button>
      <button type="button" class="anim-group" data-group="bounce">বাউন্স</button>
      <button type="button" class="anim-group" data-group="smooth">স্মুথ</button>
      <button type="button" class="anim-group" data-group="3d">থ্রিডি</button>
    </div>
    <div id="premiumGrid">
<div class="presets-grid">

<script>
  if (window.ghostInitAnimations) window.ghostInitAnimations();
  if (window.ghostInitPlan) window.ghostInitPlan();

  function triggerFileInput() {
    document.getElementById('file').click();
  }

  function handleFileSelected(input) {
    var placeholder = document.getElementById('dropPlaceholder');
    var fileLabel = document.getElementById('dropFileName');
    if (input.files && input.files[0]) {
      placeholder.style.display = 'none';
      fileLabel.style.display = 'block';
      fileLabel.innerText = input.files[0].name;
    } else {
      placeholder.style.display = 'block';
      fileLabel.style.display = 'none';
    }
  }

  // Setup drag & drop on dropzone
  var dropzone = document.getElementById('dropzone');
  ['dragenter', 'dragover'].forEach(function(eventName) {
    dropzone.addEventListener(eventName, function(e) {
      e.preventDefault();
      dropzone.classList.add('dragover');
    }, false);
  });
  ['dragleave', 'drop'].forEach(function(eventName) {
    dropzone.addEventListener(eventName, function(e) {
      e.preventDefault();
      dropzone.classList.remove('dragover');
    }, false);
  });
  dropzone.addEventListener('drop', function(e) {
    var dt = e.dataTransfer;
    var files = dt.files;
    if (files && files.length) {
      var fi = document.getElementById('file');
      fi.files = files;
      handleFileSelected(fi);
      try { fi.dispatchEvent(new Event('change')); } catch (err) {}
    }
  }, false);
</script>
